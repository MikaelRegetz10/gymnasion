version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gymnasion_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gymnasion_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gymnasion_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5433:80"
    depends_on:
      - postgres
    networks:
      - gymnasion_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymnasion_app
    restart: always
    ports:
      - "${SERVER_PORT}:8080"
    env_file:
      - .env
    environment:
      # Sobrescreve apenas a URL de conexão para apontar para o container do banco na rede Docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_SERVLET_CONTEXT_PATH: ${CONTEXT_PATH}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gymnasion_network

volumes:
  postgres_data:
    driver: local

networks:
  gymnasion_network:
    driver: bridge