# Compose de produção (VPS). Usa a imagem publicada no GHCR em vez de buildar localmente.
#
# Pré-requisitos na VPS: Traefik rodando na rede externa "web" com o entrypoint
# "websecure" e um certresolver (ex.: letsencrypt). O DNS de API_DOMAIN deve apontar para a VPS.
#
# Na VPS:
#   1. docker login ghcr.io -u <usuario> --password-stdin   (PAT com read:packages)
#   2. cp .env.prod.example .env && preencha os valores
#   3. docker compose -f docker-compose.prod.yml pull
#   4. docker compose -f docker-compose.prod.yml up -d
#
# Nenhuma porta é publicada no host: o Traefik encaminha https://${API_DOMAIN}${CONTEXT_PATH}
# para o container da API pela rede "web". O banco fica só na rede interna.
#
# Recursos: padrão de ~1.3 GB de RAM e 2 CPUs para a stack inteira (cabe numa VPS de 2 GB).
# Ajuste APP_* e DB_* no .env conforme o tamanho da VPS.

name: gymnasion

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gymnasion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    # Sem "ports": o banco só é acessível pela rede interna do Docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-1.0}"
          memory: ${DB_MEM_LIMIT:-512m}
          pids: 200
    shm_size: 128m
    logging: *default-logging

  app:
    image: ghcr.io/mikaelregetz10/gymnasion:${IMAGE_TAG:-latest}
    container_name: gymnasion_app
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      CONTEXT_PATH: ${CONTEXT_PATH:-/api}
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${FRONTEND_URL}}
      MAIL_HOST: ${MAIL_HOST:?defina MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-}
      STRAVA_MOCK_ENABLED: "false"
      # Heap em 65% do limite: o restante fica para metaspace, threads e buffers da JVM
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.gymnasion-api.rule=Host(`${API_DOMAIN:?defina API_DOMAIN}`)"
      - "traefik.http.routers.gymnasion-api.entrypoints=websecure"
      - "traefik.http.routers.gymnasion-api.tls=true"
      - "traefik.http.routers.gymnasion-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.gymnasion-api.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-1.0}"
          memory: ${APP_MEM_LIMIT:-768m}
          pids: 300
    logging: *default-logging

volumes:
  postgres_data:
    driver: local

networks:
  internal:
    driver: bridge
  # Rede do Traefik, criada fora deste projeto
  web:
    external: true
