# ===================================================================
# BASE CONFIGURATION (Comum a todos os ambientes)
# ===================================================================
spring.application.name=gymnasion

# Perfil padrão ativo quando nenhum outro for explicitamente configurado (ex: local / testes)
spring.profiles.default=dev

# SERVER CONFIGURATION
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/api}

# JPA & HIBERNATE BASE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# FLYWAY CONFIGURATION
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# NOTIFICACOES - AGENDAMENTO BASE
app.notificacoes.alunos-pendentes.tempo-limite=${NOTIF_PENDENTES_TEMPO_LIMITE:24h}
app.notificacoes.alunos-pendentes.intervalo-lembrete=${NOTIF_PENDENTES_INTERVALO:24h}
app.notificacoes.alunos-pendentes.cron=${NOTIF_PENDENTES_CRON:0 0 * * * *}
