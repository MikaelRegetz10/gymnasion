# SERVER CONFIGURATION
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/api}
spring.application.name=gymnasion

# DATABASE CONFIGURATION
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & HIBERNATE CONFIGURATION
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# FLYWAY CONFIGURATION

# Disable SQL logging in terminal
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# LOGGING CONFIGURATION
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# SECURITY CONFIGURATION (JWT)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# DEFAULT ADMIN CONFIGURATION
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# FRONTEND / CORS CONFIGURATION
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# MAIL / SMTP CONFIGURATION
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@gymnasion.local}

# NOTIFICACOES - LEMBRETE DE ALUNOS PENDENTES DE APROVACAO
# tempo-limite: tempo (X) que um aluno pode ficar pendente antes do lembrete (ex.: 24h, 30m, 2d)
# intervalo-lembrete: intervalo minimo entre lembretes para o mesmo personal
# cron: frequencia de verificacao (segundo minuto hora dia mes dia-semana)
app.notificacoes.alunos-pendentes.enabled=${NOTIF_PENDENTES_ENABLED:true}
app.notificacoes.alunos-pendentes.tempo-limite=${NOTIF_PENDENTES_TEMPO_LIMITE:24h}
app.notificacoes.alunos-pendentes.intervalo-lembrete=${NOTIF_PENDENTES_INTERVALO:24h}
app.notificacoes.alunos-pendentes.cron=${NOTIF_PENDENTES_CRON:0 0 * * * *}

# STRAVA CONFIGURATION
# Sem client-id/client-secret a integracao fica indisponivel.
# mock-enabled=true simula o Strava (somente para desenvolvimento local).
strava.client-id=${STRAVA_CLIENT_ID:}
strava.client-secret=${STRAVA_CLIENT_SECRET:}
strava.redirect-uri=${STRAVA_REDIRECT_URI:http://localhost:5173/strava/callback}
strava.mock-enabled=${STRAVA_MOCK_ENABLED:false}
