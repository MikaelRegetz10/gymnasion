name: Docker Image (GHCR)

# Publica a imagem do back-end no GitHub Container Registry (ghcr.io/gymnasion-app/gymnasion-api).
# - push na main: roda os testes e publica (tags: latest e sha-<commit>)
# - tags vX.Y.Z: roda os testes e publica a versão (tags: X.Y.Z, X.Y e sha-<commit>)
# - manual: Actions > Docker Image (GHCR) > Run workflow
#
# Pacotes novos no GHCR nascem PRIVADOS. Para a VPS baixar sem login, torne o pacote
# público (Package settings > Change visibility) ou faça na VPS:
#   echo <PAT com read:packages> | docker login ghcr.io -u <usuario> --password-stdin

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Testes
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-push:
    name: Build & Push da imagem
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Definir nome da imagem (o GHCR exige minúsculas)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS (Portainer)
    needs: build-and-push
    # Só deploya a partir da main (tags vX.Y.Z e execuções manuais em outras branches não)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Chamar o webhook da stack
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-redirs 0 -X POST \
            -H "CF-Access-Client-Id: $CF_ID" \
            -H "CF-Access-Client-Secret: $CF_SECRET" \
            "$WEBHOOK_URL")
          echo "Portainer respondeu HTTP $status"
          # 302/403 = barrado no Cloudflare Access (token errado ou vencido)
          [ "${status:0:1}" = "2" ] || exit 1