# ===================================================================
# PERFIL DE PRODUCAO (Estrito, Seguro e Otimizado)
# ===================================================================

# DATABASE CONFIGURATION (Obrigatório via variáveis de ambiente da nuvem/servidor)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARICP CONNECTION POOL (Otimizado para conexões concorrentes)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA & HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false

# LOGGING
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ERROR HANDLING & SEGURANCA (Nunca vaza stacktrace ou detalhes de classes em produção)
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

# SECURITY (JWT) (Obrigatório via variável de ambiente de produção)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# DEFAULT ADMIN USER
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# FRONTEND / CORS (URL real do app em produção)
app.frontend.url=${FRONTEND_URL}

# MAIL / SMTP (Servidor de e-mail de produção com autenticação e TLS)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM}

# NOTIFICACOES - LEMBRETE DE ALUNOS PENDENTES
app.notificacoes.alunos-pendentes.enabled=${NOTIF_PENDENTES_ENABLED:true}

# STRAVA CONFIGURATION (Credenciais reais do Strava)
strava.client-id=${STRAVA_CLIENT_ID}
strava.client-secret=${STRAVA_CLIENT_SECRET}
strava.redirect-uri=${STRAVA_REDIRECT_URI}
strava.mock-enabled=false
