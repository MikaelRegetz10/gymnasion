# ===================================================================
# PERFIL DE DESENVOLVIMENTO (Local / Staging / Testes)
# ===================================================================

# DATABASE CONFIGURATION (com fallbacks para rodar local com facilidade)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:gymnasion_db}
spring.datasource.username=${POSTGRES_USER:gymnasion_user}
spring.datasource.password=${POSTGRES_PASSWORD:gymnasion_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false

# LOGGING
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# ERROR HANDLING (Em dev, stacktrace ajuda no debug)
server.error.include-stacktrace=always
server.error.include-message=always

# SECURITY (JWT)
security.jwt.secret=${JWT_SECRET:4f7b2a6c8e9d1f0a3c5b7d9e8f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# DEFAULT ADMIN USER
admin.email=${ADMIN_EMAIL:admin@admin.com}
admin.password=${ADMIN_PASSWORD:admin@123}

# FRONTEND / CORS
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# MAIL / SMTP (Mailpit local / mock)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@gymnasion.local}

# NOTIFICACOES - LEMBRETE DE ALUNOS PENDENTES
app.notificacoes.alunos-pendentes.enabled=${NOTIF_PENDENTES_ENABLED:true}

# STRAVA CONFIGURATION
strava.client-id=${STRAVA_CLIENT_ID:}
strava.client-secret=${STRAVA_CLIENT_SECRET:}
strava.redirect-uri=${STRAVA_REDIRECT_URI:http://localhost:5173/strava/callback}
strava.mock-enabled=${STRAVA_MOCK_ENABLED:false}
